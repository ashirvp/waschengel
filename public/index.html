<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#121316" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Garage Invoice</title>
<style>
  /* Three taps and a plate, one thumb, gloves on. Everything tappable is at
     least 56px and every input is >=16px so iOS doesn't zoom on focus.
     System fonts only: the garage tablet shouldn't wait on a font CDN. */
  :root {
    --bg:#121316; --card:#1b1d22; --card-2:#202329; --line:#2c2f36;
    --text:#eef0f3; --muted:#9198a3; --muted-2:#6b7180;
    --ok:#35c46a; --warn:#e0a02c; --err:#ef4b52;
    --accent:#8b90a0; --accent-contrast:#ffffff;
  }
  /* Brand identity — the company you pick recolors the console. Not decoration:
     a wrong brand color is a visible flag that you're about to invoice the
     wrong company. To add a company, add a [data-brand="yourkey"] block using
     the same key as in src/config.js. */
  [data-brand="lambo_mclaren"] { --accent:#e8d200; --accent-contrast:#14151a; }
  [data-brand="ferrari"]       { --accent:#d2001c; --accent-contrast:#ffffff; }
  [data-brand="bentley"]       { --accent:#1f7a4d; --accent-contrast:#ffffff; }

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-size:16px; line-height:1.4;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif; }
  body { min-height:100dvh; display:flex; flex-direction:column;
    padding-bottom:calc(100px + env(safe-area-inset-bottom)); }

  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    background:rgba(18,19,22,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:17px; font-weight:700; letter-spacing:.3px; }
  .brand-dot { width:12px; height:12px; border-radius:50%; background:var(--accent); flex:none; transition:background .2s; }
  .brand-name { font-size:13px; color:var(--muted); }

  main { flex:1; padding:16px; display:grid; gap:14px; max-width:640px; width:100%; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .step-label { display:flex; align-items:center; gap:8px; margin:0 0 12px;
    font-size:12px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; color:var(--muted-2); }
  .step-num { width:20px; height:20px; border-radius:50%; background:var(--card-2); color:var(--muted);
    display:grid; place-items:center; font-size:11px; flex:none; }

  /* Step 1 — the vehicle number, the only thing anyone types. */
  #plate { width:100%; min-height:72px; padding:12px 14px; font-size:30px; font-weight:700;
    letter-spacing:.12em; text-align:center; text-transform:uppercase; font-variant-numeric:tabular-nums;
    color:var(--text); background:var(--card-2); border:1px solid var(--line); border-radius:12px; outline:none; }
  #plate:focus { border-color:var(--accent); }
  #plate::placeholder { color:var(--muted-2); }

  /* Step 2 — one big target per company. */
  .company-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .company-btn { position:relative; min-height:64px; padding:12px 14px 12px 38px; border-radius:12px;
    border:2px solid var(--line); background:var(--card-2); color:var(--text);
    font-family:inherit; font-size:16px; font-weight:600; text-align:left; cursor:pointer; }
  .company-btn::before { content:''; position:absolute; left:14px; top:50%; transform:translateY(-50%);
    width:14px; height:14px; border-radius:50%; background:var(--dot,#8b90a0); }
  .company-btn[aria-pressed="true"] { border-color:var(--dot,var(--accent)); background:#23262d; }

  .recipient { display:none; margin-top:12px; padding:10px 12px; border-radius:10px;
    background:var(--card-2); border:1px solid var(--line); font-size:13px; }
  .recipient .tag { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted-2); margin-bottom:2px; }
  .recipient .who { font-weight:600; }
  .recipient .mail { color:var(--muted); font-size:12px; margin-top:1px; word-break:break-all; }
  .recipient.bad { background:rgba(239,75,82,.10); border-color:rgba(239,75,82,.35); }
  .recipient.bad .who { color:var(--err); }

  /* Step 3 — this company's packages only. */
  .package-list { display:grid; gap:10px; }
  .package-btn { display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    width:100%; min-height:66px; padding:14px 16px; border-radius:12px; border:2px solid var(--line);
    background:var(--card-2); color:var(--text); font-family:inherit; font-size:16px; font-weight:600;
    text-align:left; cursor:pointer; }
  .package-btn[aria-pressed="true"] { border-color:var(--accent); background:#23262d; }
  .package-btn .name { min-width:0; }
  /* The Lexware description is a paragraph. Show enough to tell two similar
     packages apart; the full text still lands on the invoice. */
  .package-btn .desc { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; margin-top:3px; font-size:12px; font-weight:400; line-height:1.35; color:var(--muted-2); }
  .package-btn .price { font-size:17px; font-weight:700; white-space:nowrap;
    font-variant-numeric:tabular-nums; text-align:right; }
  .package-btn .gross { display:block; font-size:11px; font-weight:500; color:var(--muted-2); }
  .package-empty { color:var(--muted); font-size:14px; padding:8px 2px; }

  .pricewarn { display:none; margin:0 0 12px; padding:10px 12px; border-radius:10px; font-size:13px;
    background:rgba(224,160,44,.10); border:1px solid rgba(224,160,44,.35); color:var(--warn); }

  .actionbar { position:fixed; left:0; right:0; bottom:0; z-index:10;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(18,19,22,.95); backdrop-filter:blur(8px); border-top:1px solid var(--line); }
  .actionbar-inner { max-width:640px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .total { flex:none; min-width:96px; }
  .total .lbl { font-size:11px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.08em; }
  .total .val { font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  .btn-primary { flex:1; min-height:64px; border:none; border-radius:14px; background:var(--accent);
    color:var(--accent-contrast); font-family:inherit; font-size:18px; font-weight:700; cursor:pointer; }
  .btn-primary:disabled { background:#2a2d34; color:var(--muted-2); cursor:not-allowed; }

  .overlay { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    padding:20px; background:rgba(8,9,11,.85); }
  .overlay[data-open="true"] { display:flex; }
  .sheet { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line);
    border-radius:18px; padding:24px; text-align:center; }
  .sheet h2 { margin:0 0 6px; font-size:20px; }
  .sheet p { margin:0 0 18px; color:var(--muted); font-size:15px; }
  .icon { width:66px; height:66px; border-radius:50%; margin:0 auto 14px; display:grid; place-items:center;
    font-size:34px; background:rgba(53,196,106,.14); border:2px solid var(--ok); color:var(--ok); }
  .icon.warn { background:rgba(224,160,44,.14); border-color:var(--warn); color:var(--warn); }
  .voucher { font-size:26px; font-weight:700; letter-spacing:.04em; margin:6px 0 2px; }
  .plate-out { font-size:14px; color:var(--muted); margin-bottom:10px; letter-spacing:.06em; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  @media (min-width:700px) { main { padding:24px 16px; } }
</style>
</head>
<body>

<header>
  <h1>Garage Invoice</h1>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="brand-name" id="brandName">No company</span>
    <span class="brand-dot" id="brandDot"></span>
  </div>
</header>

<main>
  <section class="card">
    <p class="step-label"><span class="step-num">1</span> Vehicle number</p>
    <label class="sr-only" for="plate">Vehicle number</label>
    <input id="plate" type="text" inputmode="text" autocomplete="off"
           autocapitalize="characters" autocorrect="off" spellcheck="false"
           enterkeyhint="done" placeholder="M-AB 1234" />
  </section>

  <section class="card">
    <p class="step-label"><span class="step-num">2</span> Company</p>
    <div class="company-grid" id="companyGrid"></div>
    <div class="recipient" id="recipient"></div>
  </section>

  <section class="card">
    <p class="step-label"><span class="step-num">3</span> Service package</p>
    <p class="pricewarn" id="priceWarn"></p>
    <div class="package-list" id="packageList">
      <p class="package-empty">Pick a company first.</p>
    </div>
  </section>
</main>

<div class="actionbar">
  <div class="actionbar-inner">
    <div class="total">
      <div class="lbl">Total</div>
      <div class="val" id="totalVal">—</div>
    </div>
    <button class="btn-primary" id="submitBtn" disabled>Create Invoice</button>
  </div>
</div>

<div class="overlay" id="resultOverlay">
  <div class="sheet">
    <div class="icon" id="resultIcon">✓</div>
    <h2 id="resultTitle">Invoice created</h2>
    <div class="voucher" id="resultVoucher"></div>
    <div class="plate-out" id="resultPlate"></div>
    <p id="resultDetail"></p>
    <button class="btn-primary" id="resultNext">Next car</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var CONFIG = { companies: {}, taxRatePercentage: 19 };
  var state = { company: null, packageKey: null, busy: false };
  var $ = function (id) { return document.getElementById(id); };
  var plateEl = $('plate');

  function money(n) {
    return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(n);
  }
  function plateOk() {
    return plateEl.value.replace(/[^A-Za-z0-9ÄÖÜäöü]/g, '').length >= 2;
  }
  function selectedPackage() {
    var c = CONFIG.companies[state.company];
    if (!c || !state.packageKey) return null;
    for (var i = 0; i < c.packages.length; i++) {
      if (c.packages[i].key === state.packageKey) return c.packages[i];
    }
    return null;
  }

  // ---- Step 2: company --------------------------------------------------

  function renderCompanies() {
    var grid = $('companyGrid');
    grid.innerHTML = '';
    Object.keys(CONFIG.companies).forEach(function (key) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'company-btn';
      btn.setAttribute('aria-pressed', String(state.company === key));
      btn.textContent = CONFIG.companies[key].label;
      // Read each brand's colour from its own CSS block, so the swatch here and
      // the accent everywhere else can never drift apart.
      var probe = document.createElement('div');
      probe.setAttribute('data-brand', key);
      probe.style.display = 'none';
      document.body.appendChild(probe);
      btn.style.setProperty('--dot', getComputedStyle(probe).getPropertyValue('--accent').trim());
      document.body.removeChild(probe);
      btn.addEventListener('click', function () { setCompany(key); });
      grid.appendChild(btn);
    });
  }

  function setCompany(key) {
    state.company = key;
    document.documentElement.setAttribute('data-brand', key || '');
    $('brandName').textContent = CONFIG.companies[key] ? CONFIG.companies[key].label : 'No company';

    // Each company has its own menu, so a package chosen for the previous one
    // must not carry over — its price would belong to a different company.
    state.packageKey = null;

    renderCompanies();
    renderRecipient();
    renderPackages();
    refreshAction();
  }

  // Shows the Lexware customer being billed, so nobody has to remember that
  // "Ferrari" means "Scuderia Feser Graf GmbH".
  function renderRecipient() {
    var box = $('recipient');
    var company = CONFIG.companies[state.company];
    if (!company) { box.style.display = 'none'; return; }

    box.innerHTML = '';
    var tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = 'Invoice goes to';
    box.appendChild(tag);

    var who = document.createElement('div');
    who.className = 'who';
    if (company.recipient && company.recipient.name) {
      box.className = 'recipient';
      who.textContent = company.recipient.name;
      box.appendChild(who);
      if (company.recipient.email) {
        var mail = document.createElement('div');
        mail.className = 'mail';
        mail.textContent = company.recipient.email;
        box.appendChild(mail);
      }
    } else {
      box.className = 'recipient bad';
      who.textContent = 'Customer not found in Lexware';
      box.appendChild(who);
      var hint = document.createElement('div');
      hint.className = 'mail';
      hint.textContent = 'Tell the office before invoicing this company.';
      box.appendChild(hint);
    }
    box.style.display = 'block';
  }

  // ---- Step 3: packages -------------------------------------------------

  function renderPackages() {
    var list = $('packageList');
    list.innerHTML = '';
    var company = CONFIG.companies[state.company];

    if (!company) {
      var empty = document.createElement('p');
      empty.className = 'package-empty';
      empty.textContent = 'Pick a company first.';
      list.appendChild(empty);
      return;
    }

    company.packages.forEach(function (p) {
      // Each package carries its own VAT rate from Lexware.
      var taxRate = typeof p.taxRate === 'number' ? p.taxRate : (CONFIG.taxRatePercentage || 0);

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'package-btn';
      btn.setAttribute('aria-pressed', String(state.packageKey === p.key));

      var name = document.createElement('span');
      name.className = 'name';
      var title = document.createElement('span');
      title.textContent = p.label;
      name.appendChild(title);
      if (p.description) {
        var desc = document.createElement('span');
        desc.className = 'desc';
        desc.textContent = p.description;
        name.appendChild(desc);
      }

      var price = document.createElement('span');
      price.className = 'price';
      price.textContent = money(p.netPrice);
      var gross = document.createElement('span');
      gross.className = 'gross';
      gross.textContent = money(p.netPrice * (1 + taxRate / 100)) + ' incl. VAT';
      price.appendChild(gross);

      btn.appendChild(name);
      btn.appendChild(price);
      btn.addEventListener('click', function () {
        state.packageKey = p.key;
        renderPackages();
        refreshAction();
      });
      list.appendChild(btn);
    });
  }

  // ---- Action bar -------------------------------------------------------

  function refreshAction() {
    var pkg = selectedPackage();
    var taxRate = pkg && typeof pkg.taxRate === 'number' ? pkg.taxRate : (CONFIG.taxRatePercentage || 0);
    $('totalVal').textContent = pkg ? money(pkg.netPrice * (1 + taxRate / 100)) : '—';

    var ready = !!(state.company && state.packageKey && plateOk());
    $('submitBtn').disabled = !ready || state.busy;
    $('submitBtn').textContent = state.busy ? 'Working…' : 'Create Invoice';
  }

  plateEl.addEventListener('input', function () {
    plateEl.value = plateEl.value.toUpperCase();
    refreshAction();
  });
  plateEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); plateEl.blur(); }
  });

  // ---- Submit -----------------------------------------------------------

  function submit() {
    if (state.busy) return;
    state.busy = true;
    refreshAction();

    fetch('/api/invoice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        company: state.company,
        licensePlate: plateEl.value.trim(),
        packageKey: state.packageKey
      })
    })
      .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
      .then(function (res) {
        state.busy = false;
        if (res.status >= 400) showResult(null, res.body.error || 'Something went wrong.', res.body.detail);
        else showResult(res.body);
        refreshAction();
      })
      .catch(function () {
        state.busy = false;
        showResult(null, 'No connection to the server. Check the wifi and try again.');
        refreshAction();
      });
  }

  $('submitBtn').addEventListener('click', submit);

  // ---- Result -----------------------------------------------------------

  // An error detail can arrive as an object; concatenating one gives the
  // useless "[object Object]" instead of the reason.
  function asText(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v;
    try { return JSON.stringify(v); } catch (e) { return String(v); }
  }

  function showResult(body, errorMessage, detail) {
    var ok = !!body;
    $('resultIcon').className = 'icon' + (ok ? '' : ' warn');
    $('resultIcon').textContent = ok ? '✓' : '!';
    $('resultTitle').textContent = ok ? 'Invoice created' : 'Not created';
    $('resultVoucher').textContent = ok ? (body.voucherNumber || '') : '';
    $('resultPlate').textContent = ok ? (body.plate || '') : '';
    // The app does not send anything, so say plainly that the invoice is
    // waiting in Lexware — otherwise a worker assumes the customer has it.
    $('resultDetail').textContent = ok
      ? 'Saved in Lexware for ' + (body.recipientName || 'the customer') +
        '. The office sends it from Lexware.'
      : errorMessage + (detail ? ' — ' + asText(detail) : '');
    $('resultNext').textContent = ok ? 'Next car' : 'Back';
    $('resultOverlay').setAttribute('data-open', 'true');
  }

  $('resultNext').addEventListener('click', function () {
    $('resultOverlay').setAttribute('data-open', 'false');
    // Only clear for a new car if the last one actually went through.
    if ($('resultTitle').textContent !== 'Not created') {
      plateEl.value = '';
      state.packageKey = null;
      renderPackages();
      refreshAction();
      plateEl.focus();
    }
  });

  // ---- Boot -------------------------------------------------------------

  fetch('/api/config')
    .then(function (r) { return r.json(); })
    .then(function (cfg) {
      CONFIG = cfg;
      // Staff need to know when they're looking at stand-in prices, because an
      // invoice sent at a stale price is a real problem to unwind.
      if ((cfg.priceSource || {}).usedFallback) {
        var w = $('priceWarn');
        w.textContent = 'Prices could not be loaded from Lexware — showing the built-in list. Check with the office before invoicing.';
        w.style.display = 'block';
      }
      renderCompanies();
      renderPackages();
      refreshAction();
      var keys = Object.keys(CONFIG.companies);
      if (keys.length === 1) setCompany(keys[0]);
      plateEl.focus();
    })
    .catch(function () {
      $('packageList').innerHTML = '<p class="package-empty">Could not load the app. Reload the page.</p>';
    });
})();
</script>
</body>
</html>
